services:   
  xpense-postgres:
    image: postgres
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_PASSWORD: 'password'
    ports:
      - 5432:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
  xpense-postgres-admin:
    image: adminer
    restart: always
    ports:
      - 8080:8080

volumes:
  postgres-data: